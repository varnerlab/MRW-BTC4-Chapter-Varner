[metadata]
author = "jdv27@cornell.edu"
version = "0.1"
date = "2026-07-09"
description = "Linear pathway with end-product feedback inhibition of the input (chapter Example 2)"

[model]
list_of_static_species = ["E"]
list_of_dynamic_species = ["X1", "X2", "X3"]
list_of_connection_records = [
    "r0::{} --> X1",
    "r1::X1 --> X2",
    "r2::X2 --> X3",
    "r3::X3 --> {}"
]
list_of_kinetics_records = [
    "r0::{X3}",
    "r1::{X1}",
    "r2::{X2}",
    "r3::{X3}"
]
list_of_stoichiometry_records = []
