    "r4::C --> E",
    "r0::{} --> A",
    "r5::D --> {}",
    "r6::E --> {}"
]
list_of_kinetics_records = [
    "r0::{}",
    "r1::{A,E,E1}",
    "r2::{B,D,E2}",
    "r3::{C,E3}",
    "r4::{C,E4}",
    "r5::{D}",
    "r6::{E}"
]
list_of_stoichiometry_records = []
